<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Fondo transparente o dark -->
  <defs>
    <filter id="subtle-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#subtle-shadow)">
    <!-- Cara Superior (Tapa brillante) -->
    <polygon points="128,34 218,86 128,138 38,86" fill="#F7B238" />

    <!-- Cara Izquierda (Frente iluminado) -->
    <polygon points="38,86 128,138 128,226 38,174" fill="#E58F1B" />

    <!-- Cara Derecha (Sombra plana) -->
    <polygon points="128,138 218,86 218,174 128,226" fill="#C9750D" />

    <!-- Cinta de embalaje sobre la tapa superior -->
    <polygon points="115,41 141,56 141,130 115,115" fill="#252A34" />

    <!-- Cinta cayendo sobre la cara izquierda frontal -->
    <polygon points="115,130 128,138 128,175 115,167" fill="#1F232B" />

    <!-- Etiqueta de despacho blanca en cara izquierda -->
    <polygon points="56,122 96,145 96,177 56,154" fill="#FFFFFF" rx="2" />
    <!-- Líneas de código de barras en la etiqueta -->
    <line x1="64" y1="135" x2="64" y2="151" stroke="#252A34" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="140" x2="72" y2="156" stroke="#252A34" stroke-width="2" stroke-linecap="round"/>
    <line x1="78" y1="143" x2="78" y2="159" stroke="#252A34" stroke-width="3" stroke-linecap="round"/>
    <line x1="86" y1="148" x2="86" y2="164" stroke="#252A34" stroke-width="2" stroke-linecap="round"/>

    <!-- LED verde de estado EnvioBot -->
    <circle cx="172" cy="112" r="9" fill="#2ECC71" />
  </g>
</svg>
