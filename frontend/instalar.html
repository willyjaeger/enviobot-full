<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnvioBot Full en tu celular</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon_192.png">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#f1f5f9;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.c{max-width:420px;width:100%;text-align:center;background:#1e293b;border-radius:16px;padding:32px 24px}
.logo{width:72px;height:72px;margin:0 auto 12px;display:block}
h1{font-size:26px;margin:0 0 10px}
p{color:#cbd5e1;font-size:18px;line-height:1.5;margin:0 0 16px}
.btn{display:block;width:100%;box-sizing:border-box;margin-top:14px;padding:22px;font-size:22px;font-weight:800;border:0;border-radius:14px;background:#22c55e;color:#052e16;cursor:pointer;text-decoration:none}
.btn.sec{background:#f5a623;color:#111}
.paso{background:#0f172a;border-radius:12px;padding:14px 16px;font-size:17px;line-height:1.6;text-align:left;margin-top:14px;display:none}
</style>
</head>
<body>
<div class="c">
  <img class="logo" src="img/icon_192.png" alt="EnvioBot Full">
  <h1>EnvioBot Full en tu celular</h1>
  <p>Guardá la app en tu teléfono para abrirla con un toque.</p>

  <button id="instalar" class="btn sec" style="display:none">Guardar en mi teléfono</button>

  <div id="pasosIos" class="paso">Tocá el botón <b>Compartir</b> (el cuadrado con la flecha) y después <b>Añadir a pantalla de inicio</b>.</div>
  <div id="pasosAndroid" class="paso">Tocá los tres puntitos <b>⋮</b> de arriba a la derecha y después <b>Instalar aplicación</b>.</div>

  <a id="abrir" class="btn" href="index.html">Abrir EnvioBot Full</a>
</div>
<script>
var aviso = null;
var esIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
var $ = function (id) { return document.getElementById(id); };

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  aviso = e;
  $('instalar').style.display = 'block';
  $('pasosAndroid').style.display = 'none';
});
window.addEventListener('appinstalled', function () {
  $('instalar').style.display = 'none';
  $('pasosAndroid').style.display = 'none';
});
$('instalar').onclick = function () {
  if (!aviso) return;
  aviso.prompt();
  aviso.userChoice.then(function () { $('instalar').style.display = 'none'; });
};

if (esIos) {
  $('pasosIos').style.display = 'block';
} else {
  // Si el navegador no ofrece instalar solo, mostramos el camino por el menú
  setTimeout(function () { if (!aviso && !window.matchMedia('(display-mode: standalone)').matches) $('pasosAndroid').style.display = 'block'; }, 2000);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
