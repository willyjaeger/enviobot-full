<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña — EnvioBot Full</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f5a623' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M 13.21 2.97 L 19.71 6.59 A 2.50 2.50 0 0 1 21.00 8.77 L 21.00 15.23 A 2.50 2.50 0 0 1 19.71 17.41 L 13.21 21.03 A 2.50 2.50 0 0 1 10.79 21.03 L 4.29 17.41 A 2.50 2.50 0 0 1 3.00 15.23 L 3.00 8.77 A 2.50 2.50 0 0 1 4.29 6.59 L 10.79 2.97 A 2.50 2.50 0 0 1 13.21 2.97 Z'/%3E%3Cpolyline points='3.4 7.1 12 12 20.6 7.1'/%3E%3Cline x1='12' y1='21.1' x2='12' y2='12'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css?v=20261017_3">
    <style>
        .auth-wrapper { min-height: 85vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 36px 32px; max-width: 420px; width: 100%; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body>
    <div class="container auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <div class="logo-wrap" style="margin-bottom: 12px;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 13.21 2.97 L 19.71 6.59 A 2.50 2.50 0 0 1 21.00 8.77 L 21.00 15.23 A 2.50 2.50 0 0 1 19.71 17.41 L 13.21 21.03 A 2.50 2.50 0 0 1 10.79 21.03 L 4.29 17.41 A 2.50 2.50 0 0 1 3.00 15.23 L 3.00 8.77 A 2.50 2.50 0 0 1 4.29 6.59 L 10.79 2.97 A 2.50 2.50 0 0 1 13.21 2.97 Z"></path>
                        <polyline points="3.4 7.1 12 12 20.6 7.1"></polyline>
                        <line x1="12" y1="21.1" x2="12" y2="12"></line>
                    </svg>
                    <span style="font-weight: 800; font-size: 20px; letter-spacing: -0.2px; color: var(--text);">EnvioBot <span style="color: var(--accent);">Full</span></span>
                </div>
                <h1 style="font-size: 20px; font-weight: 800; margin-bottom: 4px;">Elegí tu nueva contraseña</h1>
                <p style="font-size: 13px; color: var(--text2);">Mínimo 6 caracteres.</p>
            </div>

            <form id="resetForm" onsubmit="guardar(event)">
                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="password2">Repetila</label>
                    <input type="password" id="password2" required minlength="6" autocomplete="new-password">
                </div>

                <div id="authMsg" role="alert" style="display: none; font-size: 12.5px; line-height: 1.45; margin: 4px 0 10px; padding: 9px 12px; border-radius: 6px;"></div>

                <button type="submit" id="btnSubmit" class="btn btn-block" style="padding: 11px; margin-top: 4px; font-size: 14px;">Guardar contraseña</button>
            </form>

            <div style="margin-top: 18px; text-align: center;">
                <a href="login.html" style="font-size: 12.5px; color: var(--accent-text); text-decoration: none;">Volver a ingresar</a>
            </div>
        </div>
    </div>

    <script src="js/teclado-formularios.js?v=20261017_1"></script>
    <script>
        const el = id => document.getElementById(id);
        // El token viene en el fragmento (#t=...) para que no quede en los logs del servidor.
        const token = new URLSearchParams(location.hash.replace(/^#/, '')).get('t') || '';
        history.replaceState({}, document.title, location.pathname);

        function mostrar(texto, ok) {
            const m = el('authMsg');
            if (!texto) { m.style.display = 'none'; return; }
            m.textContent = texto;
            m.style.display = 'block';
            m.style.color = ok ? '#7bd88f' : '#ff7676';
            m.style.background = ok ? 'rgba(76,175,80,0.1)' : 'rgba(255,82,82,0.1)';
            m.style.border = '1px solid ' + (ok ? 'rgba(76,175,80,0.3)' : 'rgba(255,82,82,0.3)');
        }

        if (!token) mostrar('Este link no es válido. Pedí uno nuevo desde "¿Olvidaste tu contraseña?" en la pantalla de ingreso.');

        async function guardar(e) {
            e.preventDefault();
            const password = el('password').value;
            if (password !== el('password2').value) { mostrar('Las dos contraseñas no coinciden.'); return; }
            if (!token) return;
            const btn = el('btnSubmit');
            btn.disabled = true;
            mostrar('');
            try {
                const res = await fetch('/api/full/auth/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await res.json();
                if (data.ok) {
                    mostrar(data.message + ' Te llevamos al ingreso...', true);
                    setTimeout(() => { window.location.href = 'login.html'; }, 2200);
                    return;
                }
                mostrar(data.error || 'No se pudo guardar. Probá de nuevo.');
            } catch (err) {
                mostrar('No hay conexión con el servidor. Probá de nuevo en un momento.');
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
